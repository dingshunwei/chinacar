<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>中国汽车品牌展示 — 中国主流汽车品牌 | 轮播</title>
<meta name="description" content="中国汽车品牌轮播展示：比亚迪、蔚来、理想、小鹏、极氪等中国主流汽车品牌。" />
<meta name="keywords" content="中国汽车品牌, 国产汽车, 比亚迪, 蔚来, 理想, 小鹏" />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://chinacar.bid/carousel.html" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#f6f7fb;color:#1a1a24;overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{position:relative;height:100vh;display:flex;flex-direction:column}
  .top{padding:18px 20px 4px;text-align:center;position:relative;z-index:5}
  .top h1{font-size:20px;font-weight:800;letter-spacing:2px}
  .top .sub{font-size:12px;color:#6b7280;margin-top:4px;letter-spacing:1px}
  .carousel{position:relative;flex:1;overflow:hidden;margin-top:8px}
  .track{display:flex;height:100%;transition:transform .5s cubic-bezier(.22,.8,.26,1)}
  .slide{flex:0 0 100%;height:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .slide .bg{position:absolute;inset:0;z-index:0}
  .slide .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.10),transparent 60%)}
  .inner{position:relative;z-index:2;text-align:center;width:100%;max-width:560px}
  .logo{width:110px;height:110px;margin:0 auto 24px;position:relative;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45))}
  .logo svg{width:100%;height:100%}
  .logo .li{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;opacity:0;transition:opacity .3s}
  .brand-name{font-size:clamp(30px,7vw,46px);font-weight:800;letter-spacing:1px}
  .brand-en{font-size:15px;letter-spacing:4px;color:rgba(255,255,255,.85);margin-top:6px}
  .tag{font-size:13px;color:rgba(255,255,255,.72);margin-top:14px;letter-spacing:.5px}
  .car{width:min(78vw,420px);height:auto;margin-top:34px;filter:drop-shadow(0 22px 30px rgba(0,0,0,.5))}
  .car svg{width:100%;height:auto}
  .page{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:6;flex-wrap:wrap;padding:0 30px}
  .page .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.32);cursor:pointer;transition:all .3s}
  .page .dot.active{width:22px;border-radius:6px;background:#fff}
  .prev,.next{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
  .prev{left:8px}.next{right:8px}
  .prev:hover,.next:hover{background:rgba(255,255,255,.14)}
  @media(max-width:520px){.prev,.next{display:none}}
  .hint{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.5);z-index:6}

.help-fab{position:fixed;right:18px;bottom:18px;z-index:9999;background:#1a1a24;color:#fff;border:none;border-radius:999px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .2s,background .2s;}
.help-fab:hover{transform:translateY(-2px);background:#2a2a35;}
.help-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10000;padding:18px;}
.help-box{background:#fff;color:#222;border-radius:16px;max-width:420px;width:100%;padding:22px;box-sizing:border-box;position:relative;direction:ltr;text-align:left;}
.help-box h3{margin:0 0 14px;font-size:20px;}
.help-close{position:absolute;right:12px;top:10px;background:none;border:none;font-size:24px;color:#999;cursor:pointer;}
.help-box input,.help-box textarea{width:100%;box-sizing:border-box;margin:8px 0;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;}
.help-box textarea{min-height:110px;resize:vertical;}
.help-box .hsend{width:100%;padding:12px;border:none;border-radius:10px;background:#1a1a24;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
.help-box .hsend:hover{background:#2a2a35;}
#helpDone{display:none;text-align:center;color:#1a9d55;font-weight:700;padding:10px 0;}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="cml" href="https://chinamobile.uk" target="_blank">◈ China Mobile</a>
    <h1>◈ 中国汽车品牌</h1>
    <div class="sub">左右滑动</div>
  </div>
  <div class="carousel" id="carousel">
    <div class="track" id="track"></div>
    <div class="page" id="dots"></div>
    <div class="hint" id="hint"></div>
    <button class="prev" id="prev">‹</button>
    <button class="next" id="next">›</button>
  </div>
</div>

<script>
  // lt: c=圆形 o=八角 a=弧线(蔚来) r=圆角方块
  const brands = [
    {z:'比亚迪', en:'BYD', badge:'BYD', lt:'c', bc:'#0d5aa8', grad:'linear-gradient(135deg,#084a8f,#1287d1)', tag:'新能源全球第一 · 技术为王', car:'#2ba0e8'},
    {z:'蔚来', en:'NIO', badge:'NIO', lt:'a', bc:'#0b6fb0', grad:'linear-gradient(135deg,#085383,#1287d1)', tag:'高端智能电动车', car:'#2ba0e8'},
    {z:'理想', en:'Li Auto', badge:'理想', lt:'r', bc:'#4399dd', grad:'linear-gradient(135deg,#2e78b8,#63b7f0)', tag:'家庭智能车 · 增程首选', car:'#7cc4f2'},
    {z:'小鹏', en:'XPeng', badge:'XP', lt:'r', bc:'#2b3a55', grad:'linear-gradient(135deg,#1c2737,#3f5577)', tag:'科技智驾 · 出海欧洲', car:'#7b9bd0'},
    {z:'极氪', en:'Zeekr', badge:'Z', lt:'r', bc:'#14161a', grad:'linear-gradient(135deg,#0b0d11,#2b3038)', tag:'高端纯电 · 性能旗舰', car:'#c9a227'},
    {z:'小米', en:'Xiaomi SU7', badge:'MI', lt:'r', bc:'#ff6a1a', grad:'linear-gradient(135deg,#e04f0a,#ff8a3d)', tag:'人车家全生态 · 爆款新星', car:'#ff8a3d'},
    {z:'吉利', en:'Geely', badge:'G', lt:'r', bc:'#1c64c9', grad:'linear-gradient(135deg,#124eb0,#2b7ff0)', tag:'收购沃尔沃 · 走向世界', car:'#4a9bff'},
    {z:'问界', en:'AITO', badge:'A', lt:'r', bc:'#c8102e', grad:'linear-gradient(135deg,#8f0b1c,#e0223a)', tag:'华为赋能 · 智慧出行', car:'#e8403f'},
    {z:'阿维塔', en:'Avatr', badge:'A', lt:'r', bc:'#1a1e26', grad:'linear-gradient(135deg,#0e1116,#2c333f)', tag:'长安+华为+宁德 · 智电新贵', car:'#5a6b84'},
    {z:'名爵', en:'MG', badge:'MG', lt:'o', bc:'#c8102e', grad:'linear-gradient(135deg,#9a0b22,#e0213f)', tag:'英伦血统 · 畅销欧洲', car:'#ff3b55'},
    {z:'奇瑞', en:'Chery', badge:'C', lt:'c', bc:'#d2232a', grad:'linear-gradient(135deg,#a51a20,#e8403f)', tag:'出口大户 · 全球热销', car:'#ff4b4b'},
    {z:'长安', en:'Changan', badge:'长安', lt:'r', bc:'#123c8c', grad:'linear-gradient(135deg,#0c2d6b,#1a52b4)', tag:'行稳致远 · 出海全球', car:'#3b78d0'},
    {z:'长城', en:'Great Wall', badge:'长城', lt:'r', bc:'#c8102e', grad:'linear-gradient(135deg,#8f0b1c,#e0223a)', tag:'SUV 专家 · 出海全球', car:'#ff3b50'},
    {z:'岚图', en:'Voyah', badge:'岚图', lt:'r', bc:'#b5832f', grad:'linear-gradient(135deg,#8f6a1f,#d7a43a)', tag:'东风高端 · 出海欧洲', car:'#f0c34c'},
    {z:'红旗', en:'Hongqi', badge:'红旗', lt:'r', bc:'#c8102e', grad:'linear-gradient(135deg,#8f0b1c,#e0223a)', tag:'国宾豪车 · 大气恢弘', car:'#e83a4a'},
    {z:'深蓝', en:'Deepal', badge:'D', lt:'r', bc:'#2f6f8f', grad:'linear-gradient(135deg,#1f4f68,#3f8fb5)', tag:'长安新睿 · 深海之蓝', car:'#57a7cc'},
    {z:'东风', en:'Dongfeng', badge:'东风', lt:'r', bc:'#c8102e', grad:'linear-gradient(135deg,#8f0b1c,#e0223a)', tag:'东风汽车 · 合资共进', car:'#e8403f'},
  ];

  // 官方 Logo 域名（Clearbit 按域名返回品牌 logo；加载失败显示下方样式徽标）
  const domains = {'比亚迪':'byd.com','蔚来':'nio.com','理想':'lixiang.com','小鹏':'xpeng.com','极氪':'zeekrlife.com','小米':'xiaomiev.com','吉利':'geely.com','问界':'aito.com','阿维塔':'avatr.com','名爵':'mg.co.uk','奇瑞':'chery.com','长安':'changan.com.cn','长城':'gwm.com.cn','岚图':'voyah.com.cn','红旗':'faw.com.cn','深蓝':'deepal.com.cn','东风':'dfmc.com.cn'};

  function logoSVG(lt, word, c){
    const W=100;
    let shape='';
    if(lt==='c'){ shape=`<circle cx="50" cy="50" r="46" fill="${c}"/>`; }
    else if(lt==='o'){ shape=`<polygon points="50,6 82,20 94,52 80,84 48,96 16,82 6,50 20,18" fill="${c}"/>`; }
    else if(lt==='a'){ shape=`<path d="M50 6 a44 44 0 1 0 0 88 a44 44 0 1 0 0 -88 M50 26 a24 24 0 1 1 0 48 a24 24 0 1 1 0 -48" fill="none" stroke="${c}" stroke-width="12"/><circle cx="50" cy="50" r="30" fill="${c}"/>`; }
    else { shape=`<rect x="8" y="8" width="84" height="84" rx="22" fill="${c}"/>`; }
    const fs = word.length>2 ? 26 : (word.length>1 ? 30 : 36);
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${shape}<text x="50" y="50" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="800" font-size="${fs}" font-family="Arial,-apple-system,sans-serif">${word}</text></svg>`;
  }

  const carSVG = (fill) => `
    <svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 98 L22 76 C26 66 38 59 54 55 L132 41 C166 35 208 38 240 49 L276 59 C292 64 305 72 315 81 C321 86 326 92 326 98 C326 104 322 109 315 109 L26 109 C18 109 14 104 14 98 Z" fill="${fill}"/>
      <path d="M56 66 C62 57 76 52 94 48 L140 42 C172 37 206 40 236 49 C254 54 267 62 275 70 L56 70 Z" fill="rgba(70,120,170,.35)"/>
      <path d="M94 48 L140 42 C168 38 202 41 232 51 C220 52 200 50 178 50 L100 52 Z" fill="rgba(255,255,255,.12)"/>
      <rect x="24" y="76" width="30" height="5" rx="2.5" fill="rgba(255,255,255,.6)"/>
      <rect x="318" y="88" width="8" height="7" rx="2" fill="rgba(255,255,255,.5)"/>
      <circle cx="80" cy="109" r="25" fill="#0b0e13"/>
      <circle cx="263" cy="109" r="25" fill="#0b0e13"/>
      <circle cx="80" cy="109" r="13" fill="${fill}"/>
      <circle cx="263" cy="109" r="13" fill="${fill}"/>
      <g stroke="#0b0e13" stroke-width="2" opacity=".6">
        <path d="M80 94 v6 M80 124 v-6 M65 109 h30 M66 100 l10 9 M94 100 l-10 9 M66 118 l10 -9 M94 118 l-10 -9"/>
        <path d="M263 94 v6 M263 124 v-6 M248 109 h30 M249 100 l10 9 M277 100 l-10 9 M249 118 l10 -9 M277 118 l-10 -9"/>
      </g>
      <circle cx="80" cy="109" r="4" fill="#0b0e13"/>
      <circle cx="263" cy="109" r="4" fill="#0b0e13"/>
    </svg>`;

  const track=document.getElementById('track'), dotsEl=document.getElementById('dots');
  let index=0;

  brands.forEach((b,i)=>{
    const s=document.createElement('div'); s.className='slide';
    s.innerHTML=`<div class="bg" style="background:${b.grad}"></div>
      <div class="inner">
        <div class="logo">${logoSVG(b.lt,b.badge,b.bc)}<img class="li" src="https://logo.clearbit.com/${domains[b.z]||''}" alt="" onload="this.style.opacity=1" onerror="this.remove()"></div>
        <div class="brand-name">${b.z}</div><div class="brand-en">${b.en}</div>
        <div class="car">${carSVG(b.car)}</div>
      </div>`;
    track.appendChild(s);
    const d=document.createElement('div'); d.className='dot'+(i===0?' active':''); d.onclick=()=>go(i); dotsEl.appendChild(d);
  });

  function go(i){
    index=Math.max(0,Math.min(brands.length-1,i));
    track.style.transform=`translateX(-${index*100}%)`;
    [...dotsEl.children].forEach((dot,k)=>dot.classList.toggle('active',k===index));
    document.getElementById('hint').textContent=`${index+1} / ${brands.length} · ${brands[index].z} ${brands[index].en}`;
  }
  document.getElementById('prev').onclick=()=>go(index-1);
  document.getElementById('next').onclick=()=>go(index+1);
  const carousel=document.getElementById('carousel'); let sx=0;
  carousel.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  carousel.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50){go(index+(dx<0?1:-1));}},{passive:true});
  go(0);
</script>

<button class="help-fab" onclick="openHelp()">Help</button>
<div class="help-modal" id="helpModal">
  <div class="help-box">
    <button class="help-close" onclick="closeHelp()">&#10005;</button>
    <h3>Help</h3>
    <form id="helpForm" onsubmit="sendHelp(event);return false;">
      <input type="hidden" name="_subject" value="Help - chinacar.bid">
      <input type="hidden" name="_captcha" value="false">
      <input type="text" name="name" placeholder="Name (optional)">
      <input type="email" name="email" placeholder="Email (optional)">
      <textarea name="message" required placeholder="How can I help?"></textarea>
      <button class="hsend" type="submit">Send</button>
    </form>
    <div id="helpDone">&#10004; Thanks! Your message has been sent.</div>
  </div>
</div>
<script>
function openHelp(){document.getElementById('helpModal').style.display='flex';}
function closeHelp(){document.getElementById('helpModal').style.display='none';}
async function sendHelp(e){e.preventDefault();var f=document.getElementById('helpForm');var btn=f.querySelector('.hsend');btn.textContent='Sending…';try{var r=await fetch('https://formsubmit.co/ajax/17289001@qq.com',{method:'POST',body:new FormData(f)});var d=await r.json();document.getElementById('helpForm').style.display='none';document.getElementById('helpDone').style.display='block';}catch(err){btn.textContent='Send';alert('Failed to send. Please try again.');}}
</script>

</body>
</html>
