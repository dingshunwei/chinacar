<script>
  const brands = [

    {name:'Hongqi', zh:'红旗', badge:'红旗', lt:'r', bc:'#c8102e', grad:'linear-gradient(135deg,#8f0b1c,#e0223a)', car:'#e83a4a', link:'https://sldiary.com/browse.html?d=21'},
    {name:'NIO', zh:'蔚来', badge:'NIO', lt:'a', bc:'#0b6fb0', grad:'linear-gradient(135deg,#085383,#1287d1)', car:'#2ba0e8', link:"https://sldiary.com/browse.html?d=18"},
    {name:'Li Auto', zh:'理想', badge:'理想', lt:'r', bc:'#4399dd', grad:'linear-gradient(135deg,#2e78b8,#63b7f0)', car:'#7cc4f2'},
    {name:'XPeng', zh:'小鹏', badge:'XP', lt:'r', bc:'#2b3a55', grad:'linear-gradient(135deg,#1c2737,#3f5577)', car:'#7b9bd0'},
    {name:'Zeekr', zh:'极氪', badge:'Z', lt:'r', bc:'#14161a', grad:'linear-gradient(135deg,#0b0d11,#2b3038)', car:'#c9a227'},
    {name:'Xiaomi SU7', zh:'小米', badge:'MI', lt:'r', bc:'#ff6a1a', grad:'linear-gradient(135deg,#e04f0a,#ff8a3d)', car:'#ff8a3d'},
    {name:'Geely', zh:'吉利', badge:'G', lt:'r', bc:'#1c64c9', grad:'linear-gradient(135deg,#124eb0,#2b7ff0)', car:'#4a9bff'},
    {name:'AITO', zh:'问界', badge:'A', lt:'r', bc:'#c8102e', grad:'linear-gradient(135deg,#8f0b1c,#e0223a)', car:'#e8403f'},
    {name:'Avatr', zh:'阿维塔', badge:'A', lt:'r', bc:'#1a1e26', grad:'linear-gradient(135deg,#0e1116,#2c333f)', car:'#5a6b84'},
    {name:'MG', zh:'名爵', badge:'MG', lt:'o', bc:'#c8102e', grad:'linear-gradient(135deg,#9a0b22,#e0213f)', car:'#ff3b55'},
    {name:'Chery', zh:'奇瑞', badge:'C', lt:'c', bc:'#d2232a', grad:'linear-gradient(135deg,#a51a20,#e8403f)', car:'#ff4b4b'},
    {name:'Changan', zh:'长安', badge:'长安', lt:'r', bc:'#123c8c', grad:'linear-gradient(135deg,#0c2d6b,#1a52b4)', car:'#3b78d0'},
    {name:'GWM', zh:'长城', badge:'长城', lt:'r', bc:'#c8102e', grad:'linear-gradient(135deg,#8f0b1c,#e0223a)', car:'#ff3b50'},
    {name:'Voyah', zh:'岚图', badge:'岚图', lt:'r', bc:'#b5832f', grad:'linear-gradient(135deg,#8f6a1f,#d7a43a)', car:'#f0c34c'},
    {name:'Deepal', zh:'深蓝', badge:'D', lt:'r', bc:'#2f6f8f', grad:'linear-gradient(135deg,#1f4f68,#3f8fb5)', car:'#57a7cc'},
    {name:'Dongfeng', zh:'东风', badge:'东风', lt:'r', bc:'#c8102e', grad:'linear-gradient(135deg,#8f0b1c,#e0223a)', car:'#e8403f'},
  ];
  const domains = {'BYD':'byd.com','NIO':'nio.com','Li Auto':'lixiang.com','XPeng':'xpeng.com','Zeekr':'zeekrlife.com','Xiaomi SU7':'xiaomiev.com','Geely':'geely.com','AITO':'aito.com','Avatr':'avatr.com','MG':'mg.co.uk','Chery':'chery.com','Changan':'changan.com.cn','GWM':'gwm.com.cn','Voyah':'voyah.com.cn','Hongqi':'faw.com.cn','Deepal':'deepal.com.cn','Dongfeng':'dfmc.com.cn'};

  function logoSVG(lt, word, c){
    let shape='';
    if(lt==='c'){ shape=`<circle cx="50" cy="50" r="46" fill="${c}"/>`; }
    else if(lt==='o'){ shape=`<polygon points="50,6 82,20 94,52 80,84 48,96 16,82 6,50 20,18" fill="${c}"/>`; }
    else if(lt==='a'){ shape=`<path d="M50 6 a44 44 0 1 0 0 88 a44 44 0 1 0 0 -88 M50 26 a24 24 0 1 1 0 48 a24 24 0 1 1 0 -48" fill="none" stroke="${c}" stroke-width="12"/><circle cx="50" cy="50" r="30" fill="${c}"/>`; }
    else { shape=`<rect x="8" y="8" width="84" height="84" rx="22" fill="${c}"/>`; }
    const fs = word.length>2 ? 26 : (word.length>1 ? 30 : 36);
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${shape}<text x="50" y="50" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="800" font-size="${fs}" font-family="Arial,-apple-system,sans-serif">${word}</text></svg>`;
  }
  const carSVG = (fill) => `<svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 98 L22 76 C26 66 38 59 54 55 L132 41 C166 35 208 38 240 49 L276 59 C292 64 305 72 315 81 C321 86 326 92 326 98 C326 104 322 109 315 109 L26 109 C18 109 14 104 14 98 Z" fill="${fill}"/>
      <path d="M56 66 C62 57 76 52 94 48 L140 42 C172 37 206 40 236 49 C254 54 267 62 275 70 L56 70 Z" fill="rgba(70,120,170,.35)"/>
      <rect x="24" y="76" width="30" height="5" rx="2.5" fill="rgba(255,255,255,.6)"/>
      <rect x="318" y="88" width="8" height="7" rx="2" fill="rgba(255,255,255,.5)"/>
      <circle cx="80" cy="109" r="25" fill="#0b0e13"/><circle cx="263" cy="109" r="25" fill="#0b0e13"/>
      <circle cx="80" cy="109" r="13" fill="${fill}"/><circle cx="263" cy="109" r="13" fill="${fill}"/>
      <g stroke="#0b0e13" stroke-width="2" opacity=".6"><path d="M80 94 v6 M80 124 v-6 M67 109 h26 M68 100 l9 9 M92 100 l-9 9 M68 118 l9 -9 M92 118 l-9 -9"/><path d="M263 94 v6 M263 124 v-6 M250 109 h26 M251 100 l9 9 M275 100 l-9 9 M251 118 l9 -9 M275 118 l-9 -9"/></g>
      <circle cx="80" cy="109" r="4" fill="#0b0e13"/><circle cx="263" cy="109" r="4" fill="#0b0e13"/>
    </svg>`;

  const grid=document.getElementById('grid');
  brands.forEach(b=>{
    const c=document.createElement('div'); c.className='card'; c.style.background=b.grad;
    c.innerHTML=`<div class="logo">${logoSVG(b.lt,b.badge,b.bc)}<img src="https://logo.clearbit.com/${domains[b.name]||''}" alt="" onload="this.style.opacity=1" onerror="this.remove()"></div>
      <div class="name">${b.name}</div><div class="zh">${b.zh}</div>
      <div class="car">${carSVG(b.car)}</div>`;
    if(b.link){ c.style.cursor="pointer"; c.onclick=function(){ location.href=b.link; }; }
    grid.appendChild(c);
  });
</script>

<script>
function openHelp(){document.getElementById('helpModal').style.display='flex';}
function closeHelp(){document.getElementById('helpModal').style.display='none';}
async function sendHelp(e){e.preventDefault();var f=document.getElementById('helpForm');var btn=f.querySelector('.hsend');btn.textContent='Sending…';try{var r=await fetch('https://formsubmit.co/ajax/17289001@qq.com',{method:'POST',body:new FormData(f)});var d=await r.json();document.getElementById('helpForm').style.display='none';document.getElementById('helpDone').style.display='block';}catch(err){btn.textContent='Send';alert('Failed to send. Please try again.');}}
</script>
